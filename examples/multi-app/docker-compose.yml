version: '3'

services:
  app-1:
    image: growilabs/growi:8
    ports:
      - 127.0.0.1:3001:3000
    links:
      - mongo:mongo
      - elasticsearch:elasticsearch
    depends_on:
        mongo:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongo:27017/growi-1?replicaSet=rs0
      - DEPLOYMENT_TYPE=growi-docker-compose
      - ELASTICSEARCH_URI=http://elasticsearch:9200/growi-1
      - PASSWORD_SEED=changeme
    restart: unless-stopped
    volumes:
      - growi_data_1:/data

  app-2:
    image: growilabs/growi:8
    ports:
      - 127.0.0.1:3002:3000
    links:
      - mongo:mongo
      - elasticsearch:elasticsearch
    depends_on:
        mongo:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongo:27017/growi-2?replicaSet=rs0
      - DEPLOYMENT_TYPE=growi-docker-compose
      - ELASTICSEARCH_URI=http://elasticsearch:9200/growi-2
      - PASSWORD_SEED=changeme
    restart: unless-stopped
    volumes:
      - growi_data_2:/data

  app-3:
    image: growilabs/growi:8
    ports:
      - 127.0.0.1:3003:3000
    links:
      - mongo:mongo
      - elasticsearch:elasticsearch
    depends_on:
        mongo:
          condition: service_healthy
        elasticsearch:
          condition: service_healthy
    environment:
      - MONGO_URI=mongodb://mongo:27017/growi-3?replicaSet=rs0
      - DEPLOYMENT_TYPE=growi-docker-compose
      - ELASTICSEARCH_URI=http://elasticsearch:9200/growi-3
      - PASSWORD_SEED=changeme
    restart: unless-stopped
    volumes:
      - growi_data_3:/data

  mongo:
    image: mongo:8.2
    # For MongoDB 6.x
    # image: mongo:6.0
    # GROWI v8 requires a replica set because it uses MongoDB change streams,
    # which are unavailable on a standalone server. A single-node set is enough.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes:
      - mongo_configdb:/data/configdb
      - mongo_db:/data/db
    healthcheck:
      # Initiates the replica set on first boot (no-op afterwards), then reports
      # healthy only once this node has actually become PRIMARY — otherwise the
      # apps would start against a set that cannot accept writes yet.
      test: >
        mongosh --quiet --eval "
          try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }
          db.hello().isWritablePrimary || quit(1)
        "
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.3.3
    # For Elasticsearch 8.x
    # image: docker.elastic.co/elasticsearch/elasticsearch:8.19.14
    environment:
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"  # increase amount if you have enough memory
      - LOG4J_FORMAT_MSG_NO_LOOKUPS=true # CVE-2021-44228 mitigation for Elasticsearch <= 6.8.20/7.16.0
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./elasticsearch/v9/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      - ./elasticsearch/v9/config/elasticsearch-plugins.yml:/usr/share/elasticsearch/config/elasticsearch-plugins.yml
      # For Elasticsearch 8.x
      #- ./elasticsearch/v8/config/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      #- ./elasticsearch/v8/config/elasticsearch-plugins.yml:/usr/share/elasticsearch/config/elasticsearch-plugins.yml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  growi_data_1:
  growi_data_2:
  growi_data_3:
  mongo_configdb:
  mongo_db:
  es_data:
